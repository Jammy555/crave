#
# ═══════════════════════════════════════════════════════════════════════
#  LunarisOS Build System
# ═══════════════════════════════════════════════════════════════════════
#
#  SECURITY: Only triggers on workflow_dispatch. PRs CANNOT run this.
#
#  REQUIRED SECRETS:
#    CRAVE_USERNAME, CRAVE_TOKEN, TELEGRAM_BOT_TOKEN,
#    TELEGRAM_CHAT_ID, ZDRIVE_API_KEY
#
#  OPTIONAL SECRETS:
#    CRAVE_FLAGS, CUSTOM_YAML, PAID
#

name: Lunaris Build System

on:
  workflow_dispatch:
    inputs:
      BUILD_MODULE:
        description: 'Build module (e.g. "bacon", "bootimage")'
        required: true
        default: 'bacon'
        type: string

      SKIP_SYNC:
        description: 'Skip syncing sources (--nosync)?'
        required: true
        default: false
        type: boolean

      RUN_RESET:
        description: 'Hard-reset repos before building (--reset)?'
        required: true
        default: false
        type: boolean

      TREE_OVERRIDES:
        description: 'Branch overrides (comma-separated). Ex: kernel:test,device:main,vendor:test. Valid: kernel, device, common, device-common, hardware, vendor, vendor-common, camera, dolby, pixelworks'
        required: false
        default: ''
        type: string

      MANIFEST_BRANCH:
        description: 'Manifest branch (default: 16.2)'
        required: false
        default: '16.2'
        type: string

      MAX_RETRIES:
        description: 'Max retries on instant crave failure (Total time: 0s)'
        required: true
        default: '5'
        type: string

      RUNNER_TOKEN:
        description: 'Optional runner token (only needed if setting up a new runner from scratch)'
        required: false
        default: ''
        type: string

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # JOB 1: SMART RUNNER DETECTION & AUTO-START
  # Detects if runner is alive inside crave devspace; restarts if stopped;
  # or sets up a new runner if RUNNER_TOKEN is provided.
  # Uses 30s timeout so connection NEVER hangs.
  # ═══════════════════════════════════════════════════════════════════════
  runner-setup:
    name: "🔧 Runner Check & Auto-Start"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
    - name: Configure crave CLI
      run: |
        mkdir -p ${HOME}/bin/
        curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
        mv ${PWD}/crave ${HOME}/bin/ 2>/dev/null || true
        sudo ln -sf ${HOME}/bin/crave /usr/bin/crave 2>/dev/null || true
        cat <<EOF > ${HOME}/crave.conf
        {
          "username": "${CRAVE_USERNAME}",
          "token": "${CRAVE_TOKEN}"
        }
        EOF
      env:
        CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
        CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

    - name: Check and start self-hosted runner in crave devspace
      run: |
        RUNNER_TOKEN="${{ github.event.inputs.RUNNER_TOKEN }}"
        REPO="${{ github.repository }}"

        status=0
        timeout 35s crave ${{ secrets.CRAVE_FLAGS }} devspace -- "
          if [ -d ~/actions-runner ] && [ -f ~/actions-runner/run.sh ]; then
            echo '✅ Runner binary found at ~/actions-runner'
            if tmux has-session -t ghactions 2>/dev/null && pgrep -f 'Runner.Listener' >/dev/null 2>&1; then
              echo '✅ Self-hosted runner is active and listening for jobs'
            else
              echo '⚠️ Runner session dead or stopped. Restarting runner in tmux...'
              tmux kill-session -t ghactions 2>/dev/null || true
              tmux new-session -d -s ghactions
              tmux send-keys -t ghactions 'cd ~/actions-runner && ./run.sh' Enter
              sleep 2
              echo '✅ Runner restarted in tmux session ghactions'
            fi
          elif [ -n \"$RUNNER_TOKEN\" ]; then
            echo '⚠️ Setting up new self-hosted runner with provided token...'
            mkdir -p ~/actions-runner && cd ~/actions-runner
            RUNNER_VER=\$(curl -s 'https://api.github.com/repos/actions/runner/releases/latest' | grep -oP '\"tag_name\": \"v\K[^\"]*')
            curl -sL -o runner.tar.gz \"https://github.com/actions/runner/releases/download/v\${RUNNER_VER}/actions-runner-linux-x64-\${RUNNER_VER}.tar.gz\"
            tar xzf runner.tar.gz && rm -f runner.tar.gz
            ./config.sh --unattended --url \"https://github.com/${REPO}\" --token \"$RUNNER_TOKEN\" --name crave-devspace --labels self-hosted,Linux,X64 --replace
            tmux kill-session -t ghactions 2>/dev/null || true
            tmux new-session -d -s ghactions
            tmux send-keys -t ghactions './run.sh' Enter
            echo '✅ New runner installed and started'
          else
            echo '❌ Runner not installed in ~/actions-runner and no RUNNER_TOKEN provided.'
            echo '   Please set up runner manually or supply RUNNER_TOKEN in workflow options.'
            exit 1
          fi
        " || status=$?

        if [[ "$status" -eq 124 || "$status" -eq 0 ]]; then
          echo "✅ Runner check/start finished."
        else
          echo "❌ Runner check failed (exit code: $status)"
          exit $status
        fi

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 2: INPUT VALIDATION
  # Quick checks before the build starts.
  # ═══════════════════════════════════════════════════════════════════════
  validate:
    name: "✅ Validate Inputs"
    runs-on: ubuntu-latest
    steps:
    - name: Check secrets
      run: |
        MISSING=""
        [[ -z "${{ secrets.CRAVE_TOKEN }}" || -z "${{ secrets.CRAVE_USERNAME }}" ]] && MISSING="${MISSING}  - CRAVE_TOKEN/USERNAME\n"
        [[ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" || -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]] && MISSING="${MISSING}  - TELEGRAM_BOT_TOKEN/CHAT_ID\n"
        [[ -z "${{ secrets.ZDRIVE_API_KEY }}" ]] && MISSING="${MISSING}  - ZDRIVE_API_KEY\n"
        if [[ -n "$MISSING" ]]; then
          echo "::error::Missing secrets:"; echo -e "$MISSING"; exit 1
        fi
        echo "✅ All secrets configured"

    - name: Validate tree overrides
      run: |
        OVERRIDES="${{ github.event.inputs.TREE_OVERRIDES }}"
        VALID="kernel device common device-common hardware vendor vendor-common camera dolby pixelworks"
        [[ -z "$OVERRIDES" ]] && { echo "✅ No overrides — using defaults"; exit 0; }

        IFS=',' read -ra ENTRIES <<< "$OVERRIDES"
        for entry in "${ENTRIES[@]}"; do
          entry=$(echo "$entry" | xargs)
          [[ -z "$entry" ]] && continue
          [[ "$entry" != *":"* ]] && { echo "::error::'$entry' must be name:branch"; exit 1; }
          name="${entry%%:*}"; name="${name,,}"; branch="${entry#*:}"
          [[ -z "$branch" ]] && { echo "::error::'$entry' has empty branch"; exit 1; }
          echo "$VALID" | grep -qw "$name" || { echo "::error::Unknown tree '$name'. Valid: $VALID"; exit 1; }
          echo "✅ $name → $branch"
        done

    - name: Show config
      run: |
        echo "Module:         ${{ github.event.inputs.BUILD_MODULE }}"
        echo "Skip Sync:      ${{ github.event.inputs.SKIP_SYNC }}"
        echo "Reset:          ${{ github.event.inputs.RUN_RESET }}"
        echo "Tree Overrides: ${{ github.event.inputs.TREE_OVERRIDES || 'defaults' }}"
        echo "Manifest:       ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Max Retries:    ${{ github.event.inputs.MAX_RETRIES }}"

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 3: BUILD
  # Runs on the self-hosted runner inside crave devspace.
  # Finds/creates clone → crave run → auto-retry on instant failures.
  # ═══════════════════════════════════════════════════════════════════════
  build:
    name: "🔨 Build LunarisOS"
    timeout-minutes: 720
    needs: [runner-setup, validate]
    runs-on: self-hosted
    concurrency:
      group: ${{ github.repository_owner }}

    steps:
    # ── Find or create the project clone (NEVER destroys) ──
    - name: Find or create project clone
      run: |
        echo "Checking for existing crave clones..."
        CLONE_JSON=$(crave clone list --json 2>/dev/null || echo '{"clones":[]}')
        CLONE_PATH=$(echo "$CLONE_JSON" | jq -r '.clones[0]."Cloned At" // empty')

        if [[ -n "$CLONE_PATH" && -d "$CLONE_PATH" ]]; then
          echo "✅ Found existing clone: $CLONE_PATH"
        else
          echo "⚠️ No clone found. Creating one..."
          CLONE_PATH="/crave-devspaces/Lineage22.1"
          crave clone create --projectID 93 "$CLONE_PATH"
          echo "✅ Created clone: $CLONE_PATH"
        fi

        echo "PROJECTFOLDER=$CLONE_PATH" >> "$GITHUB_ENV"

    # ── Notify via Telegram ──
    - name: Telegram — Build Started
      continue-on-error: true
      run: |
        MSG="🚀 *Lunaris Build Started*

        📦 Module: ${{ github.event.inputs.BUILD_MODULE }}
        🔄 Sync: ${{ github.event.inputs.SKIP_SYNC == 'true' && 'SKIP' || 'YES' }}
        🌿 Overrides: ${{ github.event.inputs.TREE_OVERRIDES || 'defaults' }}
        📁 Clone: ${PROJECTFOLDER}
        🔁 Max Retries: ${{ github.event.inputs.MAX_RETRIES }}

        [View Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

        curl -s -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}" \
          --data-urlencode "text=${MSG}" \
          -d "parse_mode=Markdown" \
          -d "disable_web_page_preview=true"
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    - name: Configure git
      run: |
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

    # ── THE BUILD — with auto-retry for instant crave failures ──
    - name: Run build (auto-retry on crave glitches)
      run: |
        cd "$PROJECTFOLDER"

        PAID_FLAG=""
        if [[ -n "${{ secrets.PAID }}" ]]; then
          PAID_FLAG="--platform aosp-silver"
        fi

        MAX_RETRIES=${{ github.event.inputs.MAX_RETRIES }}
        RETRY_DELAY=30

        for attempt in $(seq 1 "$MAX_RETRIES"); do
          echo ""
          echo "════════════════════════════════════════════════════"
          echo "  ATTEMPT ${attempt}/${MAX_RETRIES}"
          echo "════════════════════════════════════════════════════"
          echo ""

          OUTFILE=$(mktemp)
          set +e
          crave ${{ secrets.CRAVE_FLAGS }} run --no-patch ${PAID_FLAG} -- "\
            export TELEGRAM_BOT_TOKEN='${TELEGRAM_BOT_TOKEN}' && \
            export TELEGRAM_CHAT_ID='${TELEGRAM_CHAT_ID}' && \
            export ZDRIVE_API_KEY='${ZDRIVE_API_KEY}' && \
            export INPUT_SKIP_SYNC='${INPUT_SKIP_SYNC}' && \
            export INPUT_RUN_RESET='${INPUT_RUN_RESET}' && \
            export INPUT_BUILD_MODULE='${INPUT_BUILD_MODULE}' && \
            export INPUT_TREE_OVERRIDES='${INPUT_TREE_OVERRIDES}' && \
            export INPUT_MANIFEST_BRANCH='${INPUT_MANIFEST_BRANCH}' && \
            curl -LSs https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/${GITHUB_REF_NAME}/scripts/volt-secure.sh | bash -s --" 2>&1 | tee "$OUTFILE"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          TAIL_OUTPUT=$(tail -20 "$OUTFILE")
          rm -f "$OUTFILE"

          # ── SUCCESS ──
          if [[ $EXIT_CODE -eq 0 ]]; then
            echo ""
            echo "✅ Build succeeded on attempt ${attempt}!"
            exit 0
          fi

          # ── INSTANT CRAVE FAILURE (Total time: 0s) → RETRY ──
          if echo "$TAIL_OUTPUT" | grep -q "Total time: 0s" && \
             echo "$TAIL_OUTPUT" | grep -q "Build Failed"; then
            echo ""
            echo "⚠️ Instant crave failure (Total time: 0s) — attempt ${attempt}/${MAX_RETRIES}"

            if [[ $attempt -lt $MAX_RETRIES ]]; then
              echo "   Retrying in ${RETRY_DELAY}s..."

              curl -s -X POST \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "text=🔄 Crave glitch (Total time: 0s)%0AAttempt ${attempt}/${MAX_RETRIES}%0ARetrying in ${RETRY_DELAY}s..." \
                -d "parse_mode=Markdown" > /dev/null 2>&1 || true

              sleep "$RETRY_DELAY"
              continue
            else
              echo "   ❌ All ${MAX_RETRIES} attempts exhausted"

              curl -s -X POST \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "text=❌ All ${MAX_RETRIES} crave attempts failed (Total time: 0s each)" \
                -d "parse_mode=Markdown" > /dev/null 2>&1 || true

              exit 1
            fi
          fi

          # ── REAL BUILD FAILURE → DON'T RETRY ──
          echo ""
          echo "❌ Real build failure (exit: ${EXIT_CODE}) — not retrying"
          exit $EXIT_CODE
        done
      timeout-minutes: 720
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        ZDRIVE_API_KEY: ${{ secrets.ZDRIVE_API_KEY }}
        INPUT_SKIP_SYNC: ${{ github.event.inputs.SKIP_SYNC }}
        INPUT_RUN_RESET: ${{ github.event.inputs.RUN_RESET }}
        INPUT_BUILD_MODULE: ${{ github.event.inputs.BUILD_MODULE }}
        INPUT_TREE_OVERRIDES: ${{ github.event.inputs.TREE_OVERRIDES }}
        INPUT_MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH }}

    # ── Post-build Telegram notifications ──
    - name: Telegram — Success
      if: ${{ success() }}
      continue-on-error: true
      run: |
        curl -s -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}" \
          -d "text=✅ *Lunaris Build Succeeded!*%0AModule: ${{ github.event.inputs.BUILD_MODULE }}%0A[View](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
          -d "parse_mode=Markdown" \
          -d "disable_web_page_preview=true"
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    - name: Telegram — Failed/Cancelled
      if: ${{ failure() || cancelled() }}
      continue-on-error: true
      run: |
        [[ "${{ job.status }}" == "cancelled" ]] && S="🛑 Cancelled" || S="❌ Failed"
        curl -s -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}" \
          -d "text=${S} *Lunaris Build*%0AModule: ${{ github.event.inputs.BUILD_MODULE }}%0A[View](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
          -d "parse_mode=Markdown" \
          -d "disable_web_page_preview=true"
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    - name: Stop crave on cancel
      if: ${{ cancelled() }}
      run: cd "$PROJECTFOLDER" && crave stop --all
