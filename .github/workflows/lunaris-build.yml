#
# ═══════════════════════════════════════════════════════════════════════
#  LunarisOS Build System
# ═══════════════════════════════════════════════════════════════════════
#
#  SECURITY: Only triggers on workflow_dispatch. PRs CANNOT run this.
#
#  ARCHITECTURE:
#    - volt.sh runs inside the build cluster (NO secrets, pure build)
#    - monitor.sh runs on the self-hosted runner (sends Telegram updates)
#    - Secrets (bot token, zdrive key) NEVER leave the runner
#    - After build: crave pull + zdrive upload from runner side
#
#  REQUIRED SECRETS:
#    CRAVE_USERNAME, CRAVE_TOKEN, TELEGRAM_BOT_TOKEN,
#    TELEGRAM_CHAT_ID, ZDRIVE_API_KEY
#
#  OPTIONAL SECRETS:
#    CRAVE_FLAGS, PAID
#

name: Lunaris Build System

on:
  workflow_dispatch:
    inputs:
      BUILD_COMMAND:
        description: 'Build args (e.g. "--nosync --nosyncd", "--reset --tree1=kernel:test", leave empty for default bacon build)'
        required: false
        default: ''
        type: string

      MAX_RETRIES:
        description: 'Max retries on crave glitch (Total time: 0s or empty output)'
        required: true
        default: '2'
        type: string

      RUNNER_TOKEN:
        description: 'Optional runner token (only needed for first-time runner setup)'
        required: false
        default: ''
        type: string

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # JOB 1: SMART RUNNER DETECTION & AUTO-START
  # ═══════════════════════════════════════════════════════════════════════
  runner-setup:
    name: "🔧 Runner Check & Auto-Start"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
    - name: Configure crave CLI
      run: |
        mkdir -p ${HOME}/bin/
        curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
        mv ${PWD}/crave ${HOME}/bin/ 2>/dev/null || true
        sudo ln -sf ${HOME}/bin/crave /usr/bin/crave 2>/dev/null || true
        cat <<EOF > ${HOME}/crave.conf
        {
          "username": "${CRAVE_USERNAME}",
          "headers": {
            "Content-Type": "application/json",
            "Authorization": "${CRAVE_TOKEN}",
            "User-Agent": "Crave"
          },
          "projects": [],
          "server": "https://foss.crave.io/api"
        }
        EOF
      env:
        CRAVE_USERNAME: ${{ secrets.CRAVE_USERNAME }}
        CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}

    - name: Check and start self-hosted runner in crave devspace
      continue-on-error: true
      run: |
        RUNNER_TOKEN="${{ github.event.inputs.RUNNER_TOKEN }}"
        REPO="${{ github.repository }}"
        RUNNER_NAME="crave-devspace"   # name registered with GitHub Actions

        # ── Helper: query GitHub API for runner status ───────────────────────
        check_runner_status() {
          curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/runners?per_page=100" \
            | jq -r ".runners[]? | select(.name == \"${RUNNER_NAME}\") | .status"
        }

        # ── Step 1: Check if runner is already online ────────────────────────
        RUNNER_STATUS=$(check_runner_status)
        echo "Runner '${RUNNER_NAME}' status: ${RUNNER_STATUS:-unknown}"

        if [[ "$RUNNER_STATUS" == "online" ]]; then
          echo "✅ Runner is online — skipping devspace connection."
          exit 0
        fi

        echo "Runner is offline or unknown. Connecting to devspace..."

        # ── Step 2: Connect to whatever machine crave gives, start runner ────
        # Even if crave switches machines (foss→fedora→etc), this always:
        #   a) re-registers the runner on the NEW machine (config.sh --replace)
        #   b) starts run.sh with nohup so it survives SSH disconnect
        # No manual nohup needed ever again.
        status=0
        timeout 90s crave ${{ secrets.CRAVE_FLAGS }} devspace -- "
          set -e
          RUNNER_DIR=\$HOME/actions-runner
          RUNNER_LOG=/tmp/runner.log
          RUNNER_PID_FILE=/tmp/runner.pid
          REPO='${REPO}'
          RUNNER_NAME='${RUNNER_NAME}'

          echo \"On machine: \$(hostname)\"

          start_runner() {
            pkill -f 'Runner.Listener' 2>/dev/null || true
            pkill -f 'run.sh'          2>/dev/null || true
            sleep 1
            cd \"\$RUNNER_DIR\"
            nohup bash run.sh > \"\$RUNNER_LOG\" 2>&1 &
            local pid=\$!
            disown \$pid
            echo \$pid > \"\$RUNNER_PID_FILE\"
            echo \"Runner started — PID \$pid\"
            # Wait locally up to 20s for Runner.Listener to appear
            for i in \$(seq 1 20); do
              sleep 1
              pgrep -f 'Runner.Listener' >/dev/null 2>&1 && {
                echo \"Runner.Listener up after \${i}s\"; return 0; }
            done
            echo 'WARNING: Runner.Listener slow to start'; tail -15 \"\$RUNNER_LOG\" 2>/dev/null || true
          }

          if [ -d \"\$RUNNER_DIR\" ] && [ -f \"\$RUNNER_DIR/run.sh\" ]; then
            echo 'Runner binary found on this machine'

            # Always re-register if we have a token — handles machine switches.
            # --replace quietly updates the registration for this new hostname.
            if [ -n '${RUNNER_TOKEN}' ]; then
              echo 'Re-registering runner (machine may have changed)...'
              cd \"\$RUNNER_DIR\"
              ./config.sh --unattended --url \"https://github.com/\${REPO}\" \
                --token '${RUNNER_TOKEN}' --name \"\${RUNNER_NAME}\" \
                --labels self-hosted,Linux,X64 --replace 2>&1 | tail -5
            fi

            if pgrep -f 'Runner.Listener' >/dev/null 2>&1; then
              echo 'Runner.Listener already running on this machine'
            else
              echo 'Starting runner...'
              start_runner
            fi

          elif [ -n '${RUNNER_TOKEN}' ]; then
            echo 'Runner not installed — fresh install on this machine...'
            mkdir -p \"\$RUNNER_DIR\" && cd \"\$RUNNER_DIR\"
            RUNNER_VER=\$(curl -s 'https://api.github.com/repos/actions/runner/releases/latest' \
              | grep -oP '\"tag_name\": \"v\K[^\"]*')
            echo \"Downloading runner v\${RUNNER_VER}...\"
            curl -sL -o runner.tar.gz \
              \"https://github.com/actions/runner/releases/download/v\${RUNNER_VER}/actions-runner-linux-x64-\${RUNNER_VER}.tar.gz\"
            tar xzf runner.tar.gz && rm -f runner.tar.gz
            ./config.sh --unattended --url \"https://github.com/\${REPO}\" \
              --token '${RUNNER_TOKEN}' --name \"\${RUNNER_NAME}\" \
              --labels self-hosted,Linux,X64 --replace
            start_runner
          else
            echo 'ERROR: Runner not installed on this machine and no RUNNER_TOKEN provided.'
            echo 'Provide RUNNER_TOKEN in the workflow_dispatch inputs to auto-install.'
            exit 1
          fi
        " || status=$?

        # ── Step 3: Poll GitHub API until runner shows online (up to 75s) ────
        if [[ "$status" -eq 124 || "$status" -eq 0 ]]; then
          echo "Waiting for GitHub to confirm runner online..."
          for i in $(seq 1 15); do
            sleep 5
            API_STATUS=$(check_runner_status)
            echo "  [${i}/15] ${RUNNER_NAME}: ${API_STATUS:-unknown}"
            if [[ "$API_STATUS" == "online" ]]; then
              echo "✅ Runner is now online."
              break
            fi
          done
        else
          echo "Devspace connection failed (exit: $status) — runner may not start."
          # Don't hard-fail; let the build job queue and wait
        fi

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 2: INPUT VALIDATION
  # ═══════════════════════════════════════════════════════════════════════
  validate:
    name: "Validate Inputs"
    runs-on: ubuntu-latest
    steps:
    - name: Check secrets
      run: |
        MISSING=""
        [[ -z "${{ secrets.CRAVE_TOKEN }}" || -z "${{ secrets.CRAVE_USERNAME }}" ]] && MISSING="${MISSING}  - CRAVE_TOKEN/USERNAME\n"
        [[ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" || -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]] && MISSING="${MISSING}  - TELEGRAM_BOT_TOKEN/CHAT_ID\n"
        [[ -z "${{ secrets.ZDRIVE_API_KEY }}" ]] && MISSING="${MISSING}  - ZDRIVE_API_KEY\n"
        if [[ -n "$MISSING" ]]; then
          echo "::error::Missing secrets:"; echo -e "$MISSING"; exit 1
        fi
        echo "All secrets configured"

    - name: Show config
      run: |
        echo "Build Command:  ${{ github.event.inputs.BUILD_COMMAND }}"
        echo "Max Retries:    ${{ github.event.inputs.MAX_RETRIES }}"

  # ═══════════════════════════════════════════════════════════════════════
  # JOB 3: BUILD
  # Runs on the self-hosted runner inside crave devspace.
  #
  # SECURITY: No secrets are passed into `crave run`. volt.sh is a
  # pure build script. Telegram/zdrive happen on the runner side ONLY.
  # ═══════════════════════════════════════════════════════════════════════
  build:
    name: "Build LunarisOS"
    timeout-minutes: 1440
    needs: [runner-setup, validate]
    runs-on: self-hosted
    concurrency:
      group: ${{ github.repository_owner }}

    steps:
    - name: Find or create project clone
      run: |
        echo "Checking for existing crave clones in /crave-devspaces/..."
        CLONE_PATH=""
        for d in /crave-devspaces/*; do
          if [[ -d "$d" && "$d" != "/crave-devspaces/lost+found" ]]; then
            CLONE_PATH="$d"
            break
          fi
        done

        if [[ -n "$CLONE_PATH" && -d "$CLONE_PATH" ]]; then
          echo "Found existing clone at: $CLONE_PATH"
        else
          echo "No clone found. Creating one..."
          CLONE_PATH="/crave-devspaces/Lineage22.1"
          crave clone create --projectID 93 "$CLONE_PATH" || true
          echo "Clone ready at: $CLONE_PATH"
        fi

        echo "PROJECTFOLDER=$CLONE_PATH" >> "$GITHUB_ENV"
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    - name: Configure git
      run: |
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

    - name: Setup zdrive CLI
      run: |
        if ! command -v zdrive &> /dev/null; then
          curl -s https://zincdrive.com/cli | bash
          sleep 2
        fi
        export PATH="/home/admin/.local/bin:$HOME/.local/bin:$PATH"
        echo "PATH=/home/admin/.local/bin:$HOME/.local/bin:$PATH" >> "$GITHUB_ENV"
        zdrive setup "${ZDRIVE_API_KEY}"
      env:
        ZDRIVE_API_KEY: ${{ secrets.ZDRIVE_API_KEY }}

    # ── Read-only: checks crave's queue, detects a resumable job from a
    # previous cut-off run, and REQUIRES a Telegram approval before any
    # crave run is ever submitted. No build is started by this step.
    - name: Check crave queue & confirm before running
      id: gate
      run: |
        set +x
        cd "$PROJECTFOLDER"

        STATE_FILE="${PROJECTFOLDER}/.crave_tracked_job.json"
        TEAM_ID="${CRAVE_TEAM_ID:-14}"

        # Re-fetches cluster stats + resume-detection and (re)builds the
        # message text. Called once up front, and again on every tap of
        # the Refresh button — this is what makes the numbers actually
        # live instead of a one-time snapshot.
        fetch_and_build_msg() {
          RESP=""
          if [[ -n "${CRAVE_TOKEN}" ]]; then
            RESP=$(curl -s -m 20 -X POST "https://foss.crave.io/api/job/v1/get" \
              -H "Authorization: ${CRAVE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"action\":\"list\",\"page\":1,\"limit\":150,\"sort\":{\"jobId\":\"desc\"},\"filter\":{\"type\":\"batch\",\"teamId\":${TEAM_ID}},\"searchKeyword\":{}}" \
              2>/dev/null || true)
          fi

          RUNNING="?"; QUEUED="?"
          if echo "$RESP" | jq -e '.success' &>/dev/null; then
            RUNNING=$(echo "$RESP" | jq '[.data.content[]? | select(.status=="running")] | length' 2>/dev/null)
            QUEUED=$(echo "$RESP" | jq '[.data.content[]? | select(.status=="queued")]  | length' 2>/dev/null)
          fi

          MODE="fresh"
          TRACKED_JOB_ID=""
          DETAIL_LINE="🔎 No active tracked job found — this will submit a <b>new</b> build."

          if [[ -f "$STATE_FILE" ]]; then
            OLD_JOB_ID=$(jq -r '.jobId // empty' "$STATE_FILE" 2>/dev/null)
            if [[ -n "$OLD_JOB_ID" ]]; then
              JOB_STATUS=""
              if echo "$RESP" | jq -e '.success' &>/dev/null; then
                JOB_STATUS=$(echo "$RESP" | jq -r --argjson jid "$OLD_JOB_ID" \
                  '.data.content[]? | select(.jobId==$jid) | .status' 2>/dev/null | head -1)
              fi
              if [[ "$JOB_STATUS" == "queued" || "$JOB_STATUS" == "running" ]]; then
                MODE="resume"
                TRACKED_JOB_ID="$OLD_JOB_ID"
                DETAIL_LINE="$(printf '🔎 Found job <b>#%s</b> from a previous run — still <b>%s</b>.\nWill attach to it instead of submitting a new build.' "$OLD_JOB_ID" "$JOB_STATUS")"
              else
                DETAIL_LINE="$(printf '🔎 Tracked job #%s no longer active (status: %s) — clearing, fresh build.' "$OLD_JOB_ID" "${JOB_STATUS:-unknown}")"
                rm -f "$STATE_FILE"
              fi
            fi
          fi

          CHECKED_AT=$(date -u '+%H:%M:%S UTC')
          GATE_MSG="$(printf '❓ <b>Confirm before running</b>\n\n🌐 Cluster as of %s:\n🏁 Running: %s   ⏳ Queued: %s\n\n%s\n\n<i>Tap Refresh for current numbers · nothing runs until Approve.</i>' \
            "$CHECKED_AT" "$RUNNING" "$QUEUED" "$DETAIL_LINE")"
        }

        fetch_and_build_msg
        echo "mode=${MODE}  tracked_job_id=${TRACKED_JOB_ID}  running=${RUNNING}  queued=${QUEUED}"

        KEYBOARD='{"inline_keyboard":[[{"text":"🔄 Refresh","callback_data":"gate_refresh"}],[{"text":"✅ Approve","callback_data":"gate_approve"},{"text":"❌ Deny","callback_data":"gate_deny"}]]}'

        SEND_RESP=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}" -d "parse_mode=HTML" \
          -d "reply_markup=${KEYBOARD}" --data-urlencode "text=${GATE_MSG}")
        GATE_MSG_ID=$(echo "$SEND_RESP" | grep -o '"message_id":[0-9]*' | head -1 | cut -d: -f2)
        echo "Sent confirmation prompt, message_id=${GATE_MSG_ID}"

        APPROVED=""
        TG_OFFSET=0
        DEADLINE=$(( $(date +%s) + 1800 ))

        while [[ $(date +%s) -lt $DEADLINE ]]; do
          UPD=$(curl -s -m 15 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates" \
            -d "offset=$((TG_OFFSET+1))" -d "timeout=20" 2>/dev/null || true)
          LAST_ID=$(echo "$UPD" | jq -r '.result[-1].update_id // empty' 2>/dev/null)
          [[ -n "$LAST_ID" ]] && TG_OFFSET=$LAST_ID

          HIT=""
          if [[ -n "$GATE_MSG_ID" ]]; then
            HIT=$(echo "$UPD" | jq -c --argjson mid "$GATE_MSG_ID" \
              '.result[]? | select(.callback_query.message.message_id==$mid) | .callback_query' 2>/dev/null | tail -1)
          fi
          if [[ -n "$HIT" ]]; then
            CBID=$(echo "$HIT" | jq -r '.id')
            DATA=$(echo "$HIT" | jq -r '.data')

            if [[ "$DATA" == "gate_refresh" ]]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery" \
                -d "callback_query_id=${CBID}" -d "text=🔄 Refreshed" > /dev/null 2>&1 || true
              fetch_and_build_msg
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" -d "message_id=${GATE_MSG_ID}" \
                -d "parse_mode=HTML" -d "reply_markup=${KEYBOARD}" \
                --data-urlencode "text=${GATE_MSG}" > /dev/null 2>&1 || true
              DEADLINE=$(( $(date +%s) + 1800 ))
              continue
            fi

            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery" \
              -d "callback_query_id=${CBID}" -d "text=Got it" > /dev/null 2>&1 || true
            [[ "$DATA" == "gate_approve" ]] && APPROVED="1" || APPROVED="0"
            break
          fi
          sleep 3
        done

        [[ -n "$GATE_MSG_ID" ]] && curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageReplyMarkup" \
          -d "chat_id=${TELEGRAM_CHAT_ID}" -d "message_id=${GATE_MSG_ID}" \
          -d 'reply_markup={"inline_keyboard":[]}' > /dev/null 2>&1 || true

        if [[ "$APPROVED" == "1" ]]; then
          echo "approved=true" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "job_id=${TRACKED_JOB_ID}" >> "$GITHUB_OUTPUT"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" -d "parse_mode=HTML" \
            --data-urlencode "text=✅ Approved (${MODE}) — proceeding." > /dev/null 2>&1 || true
        else
          echo "approved=false" >> "$GITHUB_OUTPUT"
          REASON="denied"
          [[ -z "$APPROVED" ]] && REASON="timed out after 30 min with no response"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" -d "parse_mode=HTML" \
            --data-urlencode "text=🚫 Not approved (${REASON}) — no build was started." > /dev/null 2>&1 || true
        fi
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}
        CRAVE_TEAM_ID: ${{ secrets.CRAVE_TEAM_ID }}

    # ── THE BUILD — no secrets in crave run ──
    - name: Run build
      if: steps.gate.outputs.approved == 'true'
      run: |
        set +x
        cd "$PROJECTFOLDER"

        GATE_MODE="${{ steps.gate.outputs.mode }}"
        GATE_JOB_ID="${{ steps.gate.outputs.job_id }}"

        if [[ "$GATE_MODE" == "resume" ]]; then
          echo "Resume mode requested for job #${GATE_JOB_ID}."
          echo "NOT YET IMPLEMENTED: attaching to and pulling an already-running"
          echo "job (rather than one this run started) needs crave's actual pull"
          echo "semantics confirmed first, to avoid risking a wrong/stale artifact."
          MSG="$(printf '⚠️ <b>Resume not wired up yet</b>\n\nJob #%s is still active, but this workflow does not yet know how to safely attach to and pull a job it did not start itself. Nothing was pulled or uploaded. Ask for this to be built once the detection above looks right.' "$GATE_JOB_ID")"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" -d "parse_mode=HTML" \
            --data-urlencode "text=${MSG}" > /dev/null 2>&1 || true
          exit 0
        fi

        BUILD_COMMAND="${INPUT_BUILD_COMMAND}"
        LOG_FILE="/tmp/crave_build_output.log"
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        PAID_FLAG=""
        if [[ -n "${{ secrets.PAID }}" ]]; then
          PAID_FLAG="--platform aosp-silver"
        fi

        MAX_RETRIES=${{ github.event.inputs.MAX_RETRIES }}
        RETRY_DELAY=30

        # crave's stdout is block-buffered (not line-buffered) once it's
        # piped instead of going to a real terminal — without this, nothing
        # shows up in this log OR in LOG_FILE (so monitor.sh sees nothing
        # either) until crave's internal buffer fills or the process exits.
        STDBUF_PREFIX=""
        if command -v stdbuf &> /dev/null; then
          STDBUF_PREFIX="stdbuf -oL -eL"
        fi

        # STEP_PID is stable across every attempt in this loop — it's what
        # lets monitor.sh persist ONE Telegram message across retries, and
        # what the Stop button's "auto-retry once" flag is keyed on.
        STEP_PID=$$
        MSG_STATE_FILE="/tmp/volt_msg_state_${STEP_PID}.txt"
        STOP_SENTINEL="/tmp/volt_stop_requested_${STEP_PID}"
        STOP_RETRY_USED_FILE="/tmp/volt_stop_retry_used_${STEP_PID}"
        rm -f "$MSG_STATE_FILE" "$STOP_SENTINEL" "$STOP_RETRY_USED_FILE"

        # monitor.sh self-exits as soon as it's published a terminal/handoff
        # state — wait briefly for that instead of killing it mid-edit.
        wait_for_monitor() {
          local pid="$1" tries="${2:-8}"
          for i in $(seq 1 "$tries"); do
            kill -0 "$pid" 2>/dev/null || return 0
            sleep 2
          done
          return 1
        }

        for attempt in $(seq 1 "$MAX_RETRIES"); do
          echo ""
          echo "════════════════════════════════════════════"
          echo "  ATTEMPT ${attempt}/${MAX_RETRIES}  |  ${BUILD_COMMAND}"
          echo "════════════════════════════════════════════"

          rm -f "$LOG_FILE"
          touch "$LOG_FILE"

          # Download and start background Telegram monitor — it owns the
          # ONE Telegram message for the whole workflow run, continuing
          # across every retry attempt via MSG_STATE_FILE.
          MONITOR_SCRIPT="/tmp/volt_monitor_$$.sh"
          curl -LSs "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/${GITHUB_REF_NAME}/scripts/monitor.sh" -o "$MONITOR_SCRIPT"
          chmod +x "$MONITOR_SCRIPT"
          bash "$MONITOR_SCRIPT" "$LOG_FILE" "$STEP_PID" "$PROJECTFOLDER" "$attempt" "$MAX_RETRIES" "$BUILD_COMMAND" "$RUN_URL" &
          MONITOR_PID=$!
          echo "Monitor started (PID: $MONITOR_PID)"

          # Build volt command string — include -s -- ONLY if arguments are passed
          if [[ -n "${BUILD_COMMAND}" ]]; then
            VOLT_CMD="curl -LSs https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/${GITHUB_REF_NAME}/scripts/volt.sh | bash -s -- ${BUILD_COMMAND}"
          else
            VOLT_CMD="curl -LSs https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/${GITHUB_REF_NAME}/scripts/volt.sh | bash"
          fi

          # Run the build — NO SECRETS in this command
          #
          # stdbuf alone (previous attempt) only intercepts libc-buffered
          # I/O — if crave manages its own output (common for Go/Rust CLIs)
          # or checks isatty() to decide whether to stream live progress at
          # all, stdbuf has no effect. A pseudo-terminal via `script` fixes
          # both cases at once, since crave then genuinely believes it's
          # talking to a real terminal.
          CRAVE_WRAPPER="/tmp/crave_invoke_$$.sh"
          CRAVE_EXIT_FILE="/tmp/crave_exit_$$.txt"
          rm -f "$CRAVE_EXIT_FILE"
          printf '#!/bin/bash\n%s crave %s run --no-patch %s -- "%s"\necho $? > "%s"\n' \
            "$STDBUF_PREFIX" "${{ secrets.CRAVE_FLAGS }}" "$PAID_FLAG" "$VOLT_CMD" "$CRAVE_EXIT_FILE" \
            > "$CRAVE_WRAPPER"
          chmod +x "$CRAVE_WRAPPER"

          set +e
          if command -v script &> /dev/null; then
            script -qc "bash '$CRAVE_WRAPPER'" /dev/null 2>&1 | tee "$LOG_FILE"
          else
            bash "$CRAVE_WRAPPER" 2>&1 | tee "$LOG_FILE"
          fi
          set -e
          EXIT_CODE=$(cat "$CRAVE_EXIT_FILE" 2>/dev/null || echo 1)
          rm -f "$CRAVE_WRAPPER" "$CRAVE_EXIT_FILE"

          FULL_OUTPUT_LINES=$(wc -l < "$LOG_FILE" 2>/dev/null || echo "0")
          TAIL_OUTPUT=$(tail -30 "$LOG_FILE" 2>/dev/null || true)

          # ── MANUAL STOP (Telegram button, confirmed) — auto-retry once ──
          if [[ -f "$STOP_SENTINEL" ]]; then
            rm -f "$STOP_SENTINEL"
            wait_for_monitor "$MONITOR_PID" 6
            kill "$MONITOR_PID" 2>/dev/null || true
            wait "$MONITOR_PID" 2>/dev/null || true
            if [[ ! -f "$STOP_RETRY_USED_FILE" && $attempt -lt $MAX_RETRIES ]]; then
              touch "$STOP_RETRY_USED_FILE"
              echo "Manual stop via Telegram — auto-retrying once (attempt ${attempt}/${MAX_RETRIES})"
              sleep "$RETRY_DELAY"
              continue
            else
              echo "Manual stop via Telegram — not retrying again"
              rm -f "$MSG_STATE_FILE" "$STOP_RETRY_USED_FILE"
              exit 1
            fi
          fi

          # ── SUCCESS ──
          if [[ $EXIT_CODE -eq 0 ]]; then
            echo "Build succeeded on attempt ${attempt}!"

            echo "Pulling build artifacts..."
            crave ${{ secrets.CRAVE_FLAGS }} pull "out/target/product/lemonade/Lunaris-AOSP-lemonade*.zip" 2>&1 || true

            PULLED_ZIP=$(find . -maxdepth 1 -name "Lunaris-AOSP-lemonade*.zip" -type f 2>/dev/null | head -1)

            if [[ -n "$PULLED_ZIP" && -f "$PULLED_ZIP" ]]; then
              FILENAME=$(basename "$PULLED_ZIP")
              echo "Pulled: $FILENAME"
              echo "[VOLT_UPLOADING] ${FILENAME}" >> "$LOG_FILE"

              echo "Uploading to zdrive..."
              UPLOAD_TMP="/tmp/zdrive_upload_$$.log"
              # Stream zdrive's own output into LOG_FILE too, live — so
              # monitor.sh shows real upload progress instead of going
              # silent until the whole upload finishes.
              zdrive "$PULLED_ZIP" 2>&1 | tee "$UPLOAD_TMP" | tee -a "$LOG_FILE" > /dev/null
              DOWNLOAD_LINK=$(grep -o 'https://zdrive.to/[a-zA-Z0-9_-]*' "$UPLOAD_TMP" | tail -1)

              if [[ -n "$DOWNLOAD_LINK" ]]; then
                echo "Upload complete: $DOWNLOAD_LINK"
                echo "[VOLT_UPLOAD_OK] ${FILENAME}|${DOWNLOAD_LINK}" >> "$LOG_FILE"
              else
                echo "zdrive upload failed: $(cat "$UPLOAD_TMP")"
                echo "[VOLT_UPLOAD_FAIL] ${FILENAME}" >> "$LOG_FILE"
              fi
              rm -f "$UPLOAD_TMP" "$PULLED_ZIP"
            else
              echo "No zip found after crave pull"
              echo "[VOLT_NO_ZIP]" >> "$LOG_FILE"
            fi

            # Give monitor.sh time to see the tag and finalize the message
            wait_for_monitor "$MONITOR_PID" 10
            kill "$MONITOR_PID" 2>/dev/null || true
            wait "$MONITOR_PID" 2>/dev/null || true
            rm -f "$MSG_STATE_FILE" "$STOP_RETRY_USED_FILE"
            exit 0
          fi

          # ── DECIDE: CRAVE GLITCH vs REAL FAILURE ──
          #
          # Retry ONLY when output matches the exact crave glitch signature:
          #   "Build Failed" + "Total time: 0s" (crave never dispatched a worker)
          # OR output is completely empty (crave never connected).
          # Everything else = real failure. Send log. Exit immediately.

          IS_CRAVE_GLITCH=0
          if echo "$TAIL_OUTPUT" | grep -qF "Total time: 0s" && echo "$TAIL_OUTPUT" | grep -qF "Build Failed"; then
            IS_CRAVE_GLITCH=1
          fi
          if [[ "$FULL_OUTPUT_LINES" -eq 0 || -z "$TAIL_OUTPUT" ]]; then
            IS_CRAVE_GLITCH=1
          fi

          if [[ $IS_CRAVE_GLITCH -eq 1 ]]; then
            echo "Crave glitch (no real build started) — attempt ${attempt}/${MAX_RETRIES}"
            echo "  Output lines: ${FULL_OUTPUT_LINES}  exit: ${EXIT_CODE}"

            if [[ $attempt -lt $MAX_RETRIES ]]; then
              echo "  Retrying in ${RETRY_DELAY}s..."
              echo "[VOLT_GLITCH_RETRY] ${RETRY_DELAY}" >> "$LOG_FILE"
              wait_for_monitor "$MONITOR_PID" 6
              kill "$MONITOR_PID" 2>/dev/null || true
              wait "$MONITOR_PID" 2>/dev/null || true
              sleep "$RETRY_DELAY"
              continue
            else
              echo "  All ${MAX_RETRIES} glitch retries exhausted"
              echo "[VOLT_GLITCH_EXHAUSTED]" >> "$LOG_FILE"
              wait_for_monitor "$MONITOR_PID" 8
              kill "$MONITOR_PID" 2>/dev/null || true
              wait "$MONITOR_PID" 2>/dev/null || true
              rm -f "$MSG_STATE_FILE" "$STOP_RETRY_USED_FILE"
              exit 1
            fi
          fi

          # ── REAL BUILD FAILURE — monitor.sh sends the full log as a file ──
          echo "Real build failure (exit: ${EXIT_CODE}) — not retrying"
          echo "[VOLT_REAL_FAIL] ${EXIT_CODE}" >> "$LOG_FILE"
          wait_for_monitor "$MONITOR_PID" 8
          kill "$MONITOR_PID" 2>/dev/null || true
          wait "$MONITOR_PID" 2>/dev/null || true
          rm -f "$MSG_STATE_FILE" "$STOP_RETRY_USED_FILE"
          exit $EXIT_CODE
        done
      timeout-minutes: 1440
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        ZDRIVE_API_KEY: ${{ secrets.ZDRIVE_API_KEY }}
        INPUT_BUILD_COMMAND: ${{ github.event.inputs.BUILD_COMMAND }}
        # Used by monitor.sh for live cluster queue position/running/queued stats.
        # Optional: monitor.sh disables that feature silently if CRAVE_TOKEN is unset.
        CRAVE_TOKEN: ${{ secrets.CRAVE_TOKEN }}
        CRAVE_TEAM_ID: ${{ secrets.CRAVE_TEAM_ID }}

    - name: Stop crave on cancel
      if: ${{ cancelled() }}
      run: |
        cd "$PROJECTFOLDER" && crave stop --all

        # This is a workflow-level cancellation from the GitHub UI, not the
        # Telegram Stop button — monitor.sh is already gone by this point,
        # so this is a simple best-effort notice, not the unified message.
        # NOTE: auto-restart isn't wired up for this path — it would need a
        # workflow_dispatch re-trigger via the GitHub API. Ask if you want
        # that added.
        MSG="$(printf '🛑 <b>Workflow Cancelled</b>\n\nCancelled from GitHub Actions — crave job stopped.\nCommand: <code>%s</code>' \
          "${INPUT_BUILD_COMMAND:-bacon}")"
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}" \
          -d "parse_mode=HTML" \
          --data-urlencode "text=${MSG}" > /dev/null 2>&1 || true
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        INPUT_BUILD_COMMAND: ${{ github.event.inputs.BUILD_COMMAND }}
